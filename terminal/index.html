<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1f4d76" />
    <meta name="description" content="Sign in to Gizbit Network and send a deposit or withdrawal to the main phone." />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gizbit Terminal" />
    <title>Gizbit Terminal</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <img class="mark" src="icon-192.png" alt="" />
        <div class="brand-block">
          <p class="brand">Gizbit Terminal</p>
          <p class="sub" id="link-status" role="status">Looking for the main phone…</p>
        </div>
      </header>

      <main id="main">
        <section id="login" class="login">
          <div class="login-brand">
            <img class="hero" src="icon-512.png" alt="" />
            <h1>Gizbit Network</h1>
            <p class="lead">Enter the password for an account on the main phone.</p>
          </div>
          <div class="hint" id="install-hint">
            <p>Install this page on the other phone. Withdrawals and deposits are sent to Gizbit Network, which updates the balance.</p>
            <button type="button" id="install-go" class="btn slim" hidden>Install</button>
          </div>
          <form id="login-form" class="panel">
            <label class="field">
              <span>Password</span>
              <span class="pass-wrap">
                <input id="password" type="password" maxlength="100" autocomplete="current-password" required />
                <button type="button" id="peek" class="peek" aria-label="Show password">
                  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
                  </svg>
                </button>
              </span>
            </label>
            <button type="submit" class="btn" id="login-go">Login</button>
            <p id="login-msg" class="error" role="status"></p>
          </form>
        </section>

        <section id="bank" class="bank" hidden>
          <h1 id="welcome">Welcome</h1>
          <label class="field" id="account-pick-wrap" hidden>
            <span>Account</span>
            <select id="account-pick"></select>
          </label>
          <article class="panel account-panel">
            <p id="who" class="who"></p>
            <p id="balance" class="bal"></p>
            <p id="balance-full" class="bal-full"></p>
          </article>
          <div class="choice" role="group" aria-label="Exchange type">
            <button type="button" id="pick-withdraw" class="btn line">Withdrawal</button>
            <button type="button" id="pick-deposit" class="btn line">Deposit</button>
          </div>
          <div id="presets" class="presets"></div>
          <label class="field" id="other-wrap">
            <span>Other</span>
            <input id="other-amount" inputmode="numeric" autocomplete="off" placeholder="Type an amount" />
          </label>
          <label class="agree">
            <input id="agree" type="checkbox" />
            <span>I agree to the <button type="button" id="terms-open" class="terms-link">terms and conditions</button></span>
          </label>
          <div id="sign-block" class="sign-block is-locked">
            <p class="field"><span>Signature</span></p>
            <canvas id="sign" class="pad"></canvas>
            <button type="button" id="clear-sign" class="btn ghost slim" disabled>Clear</button>
          </div>
          <p id="move-msg" class="error" role="status"></p>
          <button type="button" id="exchange" class="btn" disabled>Exchange</button>
        </section>
      </main>
      <button type="button" id="logout" class="logout" hidden>Log out</button>
    </div>

    <div id="terms" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="terms-title">
        <h2 id="terms-title">Terms and conditions</h2>
        <p id="terms-body"></p>
        <button type="button" id="terms-close" class="btn">Close</button>
      </div>
    </div>

    <div id="done" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="done-title">
        <h2 id="done-title">Successfully exchanged</h2>
        <button type="button" id="done-ok" class="btn">OK</button>
      </div>
    </div>

    <p id="toast" class="toast" role="status" hidden></p>
    <noscript>Gizbit Terminal needs JavaScript.</noscript>
    <script src="app.js"></script>
  </body>
</html>
